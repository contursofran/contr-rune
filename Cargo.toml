[package]
name = "contr-rune"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Rune port of contr's sidebar, tabs and terminal"

[dependencies]
# Rune is pre-release: pin a rev of `dev` (never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["native-file-dialog"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
# Release signature check (R3b): the zip is signed with ed25519 in the release job.
ed25519-dalek = { version = "2", default-features = false }

[profile.dev.package."*"]
opt-level = 2
